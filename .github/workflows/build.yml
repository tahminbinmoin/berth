name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Windows Server 2025 shares the Windows 11 24H2 code base (build 26100),
    # so Berth's Windows 11 check passes and the self-test can run.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Unit tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Self-test (creates the dock, renders a frame, exits)
        shell: pwsh
        env:
          # Also toggles taskbar auto-hide on and back off (CI machine only).
          BERTH_TEST_TASKBAR: "1"
          BERTH_TEST_MOVE: "1"
        run: |
          $p = Start-Process -FilePath target\release\Berth.exe -ArgumentList '--self-test', "$PWD\self-test.txt" -PassThru
          $done = $p.WaitForExit(300000)
          if (-not $done) { Stop-Process -Id $p.Id -Force }
          "--- berth.log (tail) ---"
          Get-Content "$env:LOCALAPPDATA\Berth\berth.log" -Tail 60 -ErrorAction SilentlyContinue
          "--- report ---"
          Get-Content self-test.txt -ErrorAction SilentlyContinue
          if (-not $done) { throw "self-test timed out" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Render preview image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dash | Out-Null
          $p = Start-Process -FilePath target\release\Berth.exe -ArgumentList '--render-preview', "$PWD\preview.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "preview failed" }
          $p = Start-Process -FilePath target\release\Berth.exe -ArgumentList '--render-preview', "$PWD\dash\dock-preview-dark.png", '--dark' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dark preview failed" }
          Copy-Item preview.png dash\dock-preview-light.png

      - name: Render dashboard pages
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\Berth.exe -ArgumentList '--render-dashboard', "$PWD\dash" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dashboard render failed" }
          Get-ChildItem dash | ForEach-Object { "{0} {1}" -f $_.Name, $_.Length }

      - name: Render media (media-render branch only)
        if: github.head_ref == 'media-render'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force media | Out-Null
          $p = Start-Process -FilePath target\release\Berth.exe -ArgumentList '--render-media', "$PWD\media" -Wait -PassThru
          "exit: $($p.ExitCode)"
          Get-Content media\icons.txt -ErrorAction SilentlyContinue
          Get-ChildItem media\*.png | ForEach-Object {
            "BEGIN-PNG media-$($_.Name)"
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 3000) { "B64:" + $b.Substring($i, [Math]::Min(3000, $b.Length - $i)) }
            "END-PNG media-$($_.Name)"
          }

      - name: Print dashboard renders (pull requests only, for review)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Get-ChildItem dash\*.png | ForEach-Object {
            "BEGIN-PNG $($_.Name)"
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 3000) { "B64:" + $b.Substring($i, [Math]::Min(3000, $b.Length - $i)) }
            "END-PNG $($_.Name)"
          }

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "Berth-$version-windows-x64"
          New-Item -ItemType Directory -Force dist\$name | Out-Null
          Copy-Item target\release\Berth.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md dist\$name
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\$name.zip).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii dist\$name.zip.sha256
          Get-Content dist\$name.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: berth-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            self-test.txt
            preview.png
            dash/*.png

  # Publishes a GitHub release when main (or a v* tag) carries a version
  # that has not been released yet. Bump `version` in Cargo.toml to release.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: berth-windows-x64
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          cat > notes.md <<NOTES
          Berth $VERSION: a lightweight Mac-style dock for Windows 11.

          **Download:** \`Berth-$VERSION-windows-x64.zip\` below, then follow the [installation steps in the README](https://github.com/$GITHUB_REPOSITORY#install).

          - Requires Windows 11 (64-bit). Portable: no installer, no admin rights, no internet access.
          - This build is **not code-signed**, so Windows SmartScreen may warn on first run. Verify the SHA-256 checksum (\`.sha256\` file) before running it.
          - Built, unit-tested and self-tested on Windows by GitHub Actions from commit $GITHUB_SHA.
          NOTES
          gh release create "$TAG" artifacts/dist/*.zip artifacts/dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Berth $VERSION" --notes-file notes.md
